<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShopLink - Votre boutique WhatsApp en 2 minutes</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#16a34a', // Vert accent demandé
                        brandDark: '#15803d',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo } = React;

        // ==========================================
        // 1. COUCHE DONNÉES (Simulation Supabase)
        // En production : remplacer par @supabase/supabase-js
        // ==========================================
        const MockDB = {
            init() {
                if (!localStorage.getItem('shoplink_db')) {
                    const initialData = {
                        profiles: [],
                        stores: [],
                        products: [],
                        orders: []
                    };
                    localStorage.setItem('shoplink_db', JSON.stringify(initialData));
                }
            },
            getDB() {
                return JSON.parse(localStorage.getItem('shoplink_db'));
            },
            saveDB(db) {
                localStorage.setItem('shoplink_db', JSON.stringify(db));
            },
            // Simulation Auth
            auth: {
                signUp: async ({ email, password, name }) => {
                    const db = MockDB.getDB();
                    if (db.profiles.find(u => u.email === email)) throw new Error("Email déjà utilisé");
                    const newUser = { id: crypto.randomUUID(), email, password, name, plan: 'free', created_at: new Date().toISOString() };
                    db.profiles.push(newUser);
                    MockDB.saveDB(db);
                    return { user: { ...newUser, password: undefined }, session: { user: newUser } };
                },
                signIn: async ({ email, password }) => {
                    const db = MockDB.getDB();
                    const user = db.profiles.find(u => u.email === email && u.password === password);
                    if (!user) throw new Error("Identifiants invalides");
                    return { user: { ...user, password: undefined }, session: { user } };
                },
                signOut: async () => { return { error: null }; }
            },
            // Simulation Tables (avec RLS simplifié : vérification user_id)
            from: (table) => ({
                select: (columns = '*') => ({
                    eq: (col, val) => {
                        const db = MockDB.getDB();
                        const results = db[table].filter(row => row[col] === val);
                        return { data: results, error: null };
                    },
                    single: () => {
                        const db = MockDB.getDB();
                        return { data: db[table][0] || null, error: null };
                    }
                }),
                insert: (data) => {
                    const db = MockDB.getDB();
                    const newRow = { ...data, id: crypto.randomUUID(), created_at: new Date().toISOString() };
                    db[table].push(newRow);
                    MockDB.saveDB(db);
                    return { data: [newRow], error: null };
                },
                update: (data) => ({
                    eq: (col, val) => {
                        const db = MockDB.getDB();
                        const idx = db[table].findIndex(row => row[col] === val);
                        if (idx !== -1) {
                            db[table][idx] = { ...db[table][idx], ...data, updated_at: new Date().toISOString() };
                            MockDB.saveDB(db);
                            return { data: [db[table][idx]], error: null };
                        }
                        return { data: null, error: 'Not found' };
                    }
                }),
                delete: () => ({
                    eq: (col, val) => {
                        const db = MockDB.getDB();
                        db[table] = db[table].filter(row => row[col] !== val);
                        MockDB.saveDB(db);
                        return { error: null };
                    }
                })
            })
        };
        MockDB.init();

        // ==========================================
        // 2. CONTEXTES (État global)
        // ==========================================
        const AuthContext = createContext(null);
        const DataContext = createContext(null);

        // ==========================================
        // 3. COMPOSANTS UI RÉUTILISABLES
        // ==========================================
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button' }) => {
            const base = "w-full py-3 px-4 rounded-lg font-semibold transition-all duration-200 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-brand text-white hover:bg-brandDark disabled:bg-gray-300",
                secondary: "bg-gray-100 text-gray-800 hover:bg-gray-200 border border-gray-200",
                danger: "bg-red-50 text-red-600 hover:bg-red-100 border border-red-200",
                outline: "border-2 border-brand text-brand hover:bg-brand hover:text-white"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Input = ({ label, ...props }) => (
            <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                <input {...props} className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand focus:border-transparent outline-none transition-all" />
            </div>
        );

        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-4 ${className}`}>{children}</div>
        );

        // ==========================================
        // 4. VUES DE L'APPLICATION
        // ==========================================
        
        // --- AUTHENTIFICATION ---
        const AuthView = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({ name: '', email: '', password: '' });
            const [error, setError] = useState('');
            const { login, register } = useContext(AuthContext);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    if (isLogin) {
                        await login(formData.email, formData.password);
                    } else {
                        await register(formData.name, formData.email, formData.password);
                    }
                } catch (err) {
                    setError(err.message);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gray-50">
                    <div className="w-full max-w-md fade-in">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-brand rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand/30">
                                <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                            </div>
                            <h1 className="text-2xl font-bold text-gray-900">ShopLink</h1>
                            <p className="text-gray-500 mt-1">Votre boutique WhatsApp en 2 minutes</p>
                        </div>

                        <Card className="p-6">
                            <h2 className="text-xl font-bold mb-6">{isLogin ? 'Connexion' : 'Créer un compte'}</h2>
                            {error && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm">{error}</div>}
                            
                            <form onSubmit={handleSubmit}>
                                {!isLogin && <Input label="Nom complet" type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="Ex: Jean Dupont" />}
                                <Input label="Email" type="email" required value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} placeholder="vous@exemple.com" />
                                <Input label="Mot de passe" type="password" required value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} placeholder="••••••••" />
                                
                                <Button type="submit" className="mt-2">{isLogin ? 'Se connecter' : 'S\'inscrire gratuitement'}</Button>
                            </form>
                            
                            <p className="text-center mt-6 text-sm text-gray-600">
                                {isLogin ? 'Pas encore de compte ?' : 'Déjà un compte ?'} 
                                <button onClick={() => setIsLogin(!isLogin)} className="text-brand font-semibold ml-1 hover:underline">
                                    {isLogin ? 'S\'inscrire' : 'Se connecter'}
                                </button>
                            </p>
                        </Card>
                    </div>
                </div>
            );
        };

        // --- CRÉATION DE BOUTIQUE ---
        const StoreSetupView = ({ onComplete }) => {
            const { user } = useContext(AuthContext);
            const [formData, setFormData] = useState({ name: '', description: '', whatsapp: '', location: '', slug: '' });

            const generateSlug = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

            const handleSubmit = async (e) => {
                e.preventDefault();
                const slug = generateSlug(formData.name);
                const { data, error } = await MockDB.from('stores').insert({
                    user_id: user.id,
                    name: formData.name,
                    slug: slug,
                    description: formData.description,
                    whatsapp: formData.whatsapp.replace(/\D/g, ''), // Nettoyer le numéro
                    location: formData.location,
                    logo_url: `https://placehold.co/100x100/16a34a/white?text=${formData.name.charAt(0)}`,
                    plan: 'free'
                });
                if (!error) onComplete();
            };

            return (
                <div className="min-h-screen p-4 bg-gray-50">
                    <div className="max-w-md mx-auto fade-in">
                        <h2 className="text-2xl font-bold mb-2">Créer votre boutique</h2>
                        <p className="text-gray-500 mb-6">Configurez votre espace de vente en quelques secondes.</p>
                        
                        <Card className="p-6">
                            <form onSubmit={handleSubmit}>
                                <Input label="Nom de la boutique" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value, slug: generateSlug(e.target.value)})} placeholder="Ex: Mode Élégance" />
                                <Input label="Lien personnalisé (slug)" value={formData.slug} readOnly className="bg-gray-50 text-gray-500" placeholder="shoplink.com/votre-boutique" />
                                <Input label="Numéro WhatsApp (avec indicatif)" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} placeholder="Ex: +229 97 00 00 00" />
                                <Input label="Localisation" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} placeholder="Ex: Cotonou, Bénin" />
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Description</label>
                                    <textarea required value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand focus:border-transparent outline-none" rows="3" placeholder="Décrivez vos produits..."></textarea>
                                </div>
                                <Button type="submit">Créer la boutique</Button>
                            </form>
                        </Card>
                    </div>
                </div>
            );
        };

        // --- TABLEAU DE BORD VENDEUR ---
        const DashboardView = ({ navigate }) => {
            const { user } = useContext(AuthContext);
            const [store, setStore] = useState(null);
            const [products, setProducts] = useState([]);
            const [stats, setStats] = useState({ views: 0, orders: 0 });

            useEffect(() => {
                const loadData = async () => {
                    const { data: storeData } = await MockDB.from('stores').select().eq('user_id', user.id).single();
                    setStore(storeData);
                    if (storeData) {
                        const { data: prodData } = await MockDB.from('products').select().eq('store_id', storeData.id);
                        setProducts(prodData || []);
                        setStats({ views: Math.floor(Math.random() * 500) + 50, orders: Math.floor(Math.random() * 20) }); // Simulation stats
                    }
                };
                loadData();
            }, [user]);

            if (!store) return <StoreSetupView onComplete={() => window.location.reload()} />;

            const isLimitReached = products.length >= 5 && store.plan === 'free';

            return (
                <div className="min-h-screen bg-gray-50 pb-20">
                    <div className="bg-brand text-white p-6 pb-12">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <h1 className="text-2xl font-bold">{store.name}</h1>
                                <p className="text-green-100 text-sm">Plan: {store.plan === 'free' ? 'Gratuit (5 produits max)' : 'Pro'}</p>
                            </div>
                            <button onClick={() => { localStorage.removeItem('shoplink_session'); window.location.reload(); }} className="text-sm bg-white/20 px-3 py-1 rounded-full hover:bg-white/30">Déconnexion</button>
                        </div>
                        <div className="flex gap-4 mt-6">
                            <div className="bg-white/10 rounded-lg p-3 flex-1 text-center backdrop-blur-sm">
                                <div className="text-2xl font-bold">{products.length}</div>
                                <div className="text-xs text-green-100">Produits</div>
                            </div>
                            <div className="bg-white/10 rounded-lg p-3 flex-1 text-center backdrop-blur-sm">
                                <div className="text-2xl font-bold">{stats.orders}</div>
                                <div className="text-xs text-green-100">Commandes</div>
                            </div>
                            <div className="bg-white/10 rounded-lg p-3 flex-1 text-center backdrop-blur-sm">
                                <div className="text-2xl font-bold">{stats.views}</div>
                                <div className="text-xs text-green-100">Vues</div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-md mx-auto px-4 -mt-6">
                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <Button onClick={() => navigate('products')} variant="primary" className="shadow-lg shadow-brand/20">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                Ajouter produit
                            </Button>
                            <Button onClick={() => navigate('public', store.slug)} variant="secondary" className="bg-white">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                Voir boutique
                            </Button>
                        </div>

                        <h3 className="font-bold text-gray-800 mb-3">Mes produits récents</h3>
                        {products.length === 0 ? (
                            <Card className="text-center py-8 text-gray-500">
                                <p>Aucun produit pour le moment.</p>
                                <button onClick={() => navigate('products')} className="text-brand font-semibold mt-2">Ajouter mon premier produit</button>
                            </Card>
                        ) : (
                            <div className="space-y-3">
                                {products.slice(0, 3).map(p => (
                                    <Card key={p.id} className="flex items-center gap-3">
                                        <img src={p.image_url} className="w-12 h-12 rounded-lg object-cover bg-gray-100" />
                                        <div className="flex-1">
                                            <div className="font-semibold text-sm">{p.name}</div>
                                            <div className="text-brand font-bold">{p.price} F CFA</div>
                                        </div>
                                        <span className={`text-xs px-2 py-1 rounded-full ${p.is_visible ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                            {p.is_visible ? 'Visible' : 'Masqué'}
                                        </span>
